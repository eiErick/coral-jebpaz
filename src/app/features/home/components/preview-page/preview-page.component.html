<div class="workspace">
    <button class="btn-pdf" [disabled]="isExporting()" (click)="exportToPdf()">
        {{ isExporting() ? 'Gerando PDF Leve...' : 'Salvar como PDF' }}
    </button>

    <div #reportContent class="page-container" [ngStyle]="cssVariables()">
        
        <div class="header">
            <div class="titulo-geral">{{ title() }}</div>
        </div>

        <div class="content-flow" [class.dual-columns]="columns() == 2">
            @for (block of blocks(); track block.id) {
                <div class="doc-block" [ngClass]="block.type">
                    {{ block.content }}
                </div>
            }
        </div>

    </div>
</div>
