<div class="block-card" [style.border-left-color]="getBlockColor()">
  <div class="block-actions">
    <select [value]="type()" (change)="onTypeChange($event)" class="type-select">
      <option value="section">TÍTULO</option>
      <option value="verse">VERSO</option>
      <option value="chorus">REFRÃO</option>
    </select>

    <div class="btn-group">
      <button (click)="move.emit('up')" title="Mover para cima">↑</button>
      <button (click)="move.emit('down')" title="Mover para baixo">↓</button>
      <button class="btn-danger" [class.confirming]="isConfirmingDelete()" (click)="handleDelete()">
        {{ isConfirmingDelete() ? 'Confirmar?' : 'Excluir' }}
      </button>
    </div>
  </div>

  <textarea [value]="content()" (input)="onTextChange($event)" placeholder="Digite o texto aqui...">
  </textarea>
</div>
